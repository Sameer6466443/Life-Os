
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Study OS — Your Study Universe</title>
<style>
:root{--bg:#080817;--panel:#111126;--panel2:#171733;--text:#f4f2ff;--muted:#aaa8c8;--cyan:#63e8ff;--purple:#a78bfa;--pink:#ff8fce;--green:#72f1b8;--border:rgba(180,170,255,.17)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#272052 0,transparent 38%),radial-gradient(ellipse at 100% 30%,#132d49 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:26px 18px 15px;max-width:1100px;margin:auto}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font-size:clamp(30px,6vw,48px);margin:9px 0 6px;letter-spacing:-1.5px}h1 span{color:var(--cyan)}.subtitle,.muted,.desc{color:var(--muted);line-height:1.6}.subtitle{margin:0}nav{display:flex;gap:8px;overflow:auto;padding:12px 18px 18px;max-width:1100px;margin:auto}nav a{white-space:nowrap;text-decoration:none;color:var(--muted);background:#121226;border:1px solid var(--border);padding:10px 13px;border-radius:12px;font-size:13px}main{max-width:1100px;margin:auto;padding:0 18px 50px}section{scroll-margin-top:20px;margin:0 0 23px}.section-title{font-size:21px;margin:0 0 13px}.desc{font-size:13px;margin:-5px 0 15px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,rgba(24,24,52,.96),rgba(14,14,32,.96));border:1px solid var(--border);border-radius:19px;padding:18px;min-width:0}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.card h3{margin:0 0 8px;font-size:16px}.muted{font-size:13px}.big{font-size:30px;font-weight:800;margin:8px 0}.accent{color:var(--cyan)}.purple{color:var(--purple)}.pink{color:var(--pink)}.green{color:var(--green)}.progress{height:7px;background:#292744;border-radius:20px;overflow:hidden;margin:12px 0}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:20px;transition:width .25s}.btn{background:linear-gradient(110deg,#6b5bdb,#347fbb);color:white;border:0;border-radius:11px;padding:10px 13px;font-weight:650}.btn.secondary{background:#242440;border:1px solid var(--border)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input,select,textarea{width:100%;background:#0b0b1b;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--cyan)}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--border);border-radius:12px;background:#0c0c1e}.item input[type=checkbox],.topic input{width:18px;accent-color:var(--cyan);margin-top:2px;flex-shrink:0}.item-text{flex:1;font-size:13px;line-height:1.5}.done .item-text{text-decoration:line-through;color:#77758f}.topic-list{margin-top:12px;display:grid;gap:8px}.topic{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#d9d6ee;line-height:1.5}.topic.done span{text-decoration:line-through;color:#77758f}.tag{display:inline-block;padding:5px 8px;border:1px solid var(--border);border-radius:9px;font-size:11px;color:var(--cyan);margin:0 5px 6px 0}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0c0c1e;padding:12px;border-radius:12px;border:1px solid var(--border)}.stat strong{display:block;font-size:22px;margin-bottom:4px}.stat span{font-size:11px;color:var(--muted)}.status{padding:11px 13px;border-radius:10px;background:#111126;border:1px solid var(--border);font-size:13px;line-height:1.5;white-space:pre-wrap}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}hr{border:0;border-top:1px solid var(--border);margin:17px 0}@media(max-width:760px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}header{padding-top:22px}.card{padding:15px}.stat strong{font-size:19px}}

:root{--bg:#080b18;--panel:#11172a;--panel2:#19223b;--text:#f5f6ff;--muted:#a4adc6;--cyan:#8de7e0;--purple:#a89aff;--pink:#f3a6d7;--green:#8de7c0;--border:rgba(173,190,255,.15)}
body{background:radial-gradient(ellipse at 76% 26%,rgba(73,76,155,.23),transparent 35%),radial-gradient(ellipse at 12% 75%,rgba(40,116,130,.12),transparent 35%),#080b18;overflow-x:hidden}
.site-header{max-width:1180px;display:flex;justify-content:space-between;align-items:center;padding:26px 26px 18px}.brandmark{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:1.6px;font-size:15px}.brand-icon{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(168,154,255,.5);border-radius:12px;color:var(--cyan);font-size:20px;background:rgba(168,154,255,.09)}.brand-accent{color:var(--cyan)}.header-note{font-size:10px;letter-spacing:2.2px;color:#7f89a8}
</style>
